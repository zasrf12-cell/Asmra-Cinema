<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إضافة فيلم جديد</title>
    <style>
        body {
            background: #0b0b0e;
            color: #fff;
            font-family: Tahoma, sans-serif;
            padding: 20px;
            direction: rtl;
        }
        .form-container {
            max-width: 400px;
            margin: auto;
            background: #15151c;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: #22222f;
            border: 1px solid #33334d;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(45deg, #ff1493, #ff4500);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        a {
            color: #00bcd4;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>إضافة فيلم جديد لسيما أسمرة</h2>
        <form method="POST">
            <input type="text" name="title" placeholder="اسم الفيلم" required>
            <textarea name="description" placeholder="الوصف" rows="3"></textarea>
            <input type="text" name="watch_link" placeholder="رابط المشاهدة">
            <input type="text" name="image_url" placeholder="رابط الصورة">
            <input type="text" name="genre" placeholder="التصنيف (مثلاً: أكشن)">
            <input type="number" step="0.1" name="rating" placeholder="التقييم (مثلاً: 8.5)">
            <button type="submit">حفظ الفيلم</button>
        </form>
        <a href="{{ url_for('index') }}">العودة للرئيسية</a>
    </div>
</body>
</html>
