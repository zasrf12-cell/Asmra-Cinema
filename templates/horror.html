<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أفلام الرعب والتشويق - CINEMA ASMRA</title>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 10px;
            text-align: center;
        }
        .nav-bar {
            background: #121212;
            padding: 12px;
            border-bottom: 2px solid #ff0033;
            margin-bottom: 20px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .nav-bar a {
            color: #00ffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .nav-bar a.active {
            color: #ff0033;
        }
        h1 {
            color: #ff0033;
            font-size: 24px;
            margin: 10px 0;
        }
        .movie-card {
            background: #111;
            border: 2px solid #ff0033;
            border-radius: 12px;
            padding: 15px;
            margin: 15px auto;
            width: 90%;
            text-align: right;
        }
        .movie-title {
            color: #00ffff;
            font-size: 18px;
            font-weight: bold;
        }
        .movie-desc {
            color: #b0b0b0;
            font-size: 12px;
            margin: 8px 0;
        }
        .btn-watch {
            background: #ff0033;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            display: block;
            text-align: center;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="/">الرئيسية</a>
        <a href="/action">أكشن</a>
        <a href="/horror" class="active">رعب وتشويق 👻</a>
        <a href="/comedy">كوميدي 🎭</a>
        <a href="/romance">رومانسي ❤️</a>
        <a href="/scifi">خيال علمي 🌌</a>
    </div>

    <h1>💀 قسم الرعب والإثارة المطلقة</h1>

    <div class="movie-card">
        <div class="movie-title">The Conjuring</div>
        <div class="movie-desc">⭐ 8.5 | أرواح شريرة تطارد عائلة في منزل مسكون بأسرار مرعبة.</div>
        <a href="#" class="btn-watch">مشاهدة العمل الهندسي</a>
    </div>

    <div class="movie-card">
        <div class="movie-title">A Quiet Place</div>
        <div class="movie-desc">⭐ 8.1 | كائنات فضائية عمياء تصطاد بمجرد سماع أي صوت. الحذر أو الموت!</div>
        <a href="#" class="btn-watch">مشاهدة العمل الهندسي</a>
    </div>

</body>
</html>
