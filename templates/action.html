<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أفلام الأكشن - CINEMA ASMRA</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 10px;
        }
        .nav-bar {
            background: #161616;
            padding: 12px;
            text-align: center;
            border-bottom: 2px solid #ff007f;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .nav-bar a {
            color: #00ffff;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }
        .nav-bar a.active {
            color: #ff007f;
        }
        header {
            text-align: center;
            padding: 10px;
            margin-bottom: 15px;
        }
        h1 {
            color: #00ffff;
            font-size: 24px;
            margin: 5px 0;
        }
        .movie-card {
            background: #121212;
            border: 2px solid #ff007f;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        .movie-title {
            color: #00ffff;
            font-size: 20px;
            margin: 10px 0 5px 0;
            font-weight: bold;
        }
        .movie-desc {
            color: #cccccc;
            font-size: 13px;
            margin-bottom: 12px;
        }
        .btn-watch {
            background: #ff0033;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            display: inline-block;
            border-radius: 6px;
            font-weight: bold;
            width: 75%;
        }
    </style>
</head>
<body>

    <!-- شريط التنقل لربط الصفحات -->
    <div class="nav-bar">
        <a href="/">الرئيسية</a> |
        <a href="/action" class="active">أفلام الأكشن</a>
    </div>

    <header>
        <h1>⚡ قسم أفلام الأكشن والحرب</h1>
    </header>

    <!-- كروت أفلام الأكشن -->
    <div class="movie-card">
        <div class="movie-title">Extraction</div>
        <div class="movie-desc">⭐ 8.0 | مرزوق في مهمة خطيرة وسط معارك حربية واشتباكات ضارية.</div>
        <a href="#" class="btn-watch">مشاهدة وعرض</a>
    </div>

    <div class="movie-card">
        <div class="movie-title">The Gray Man</div>
        <div class="movie-desc">⭐ 8.2 | مطاردات عنيفة وقتال شوارع واكتشاف أسرار عسكرية خطيرة.</div>
        <a href="#" class="btn-watch">مشاهدة وعرض</a>
    </div>

</body>
</html>
