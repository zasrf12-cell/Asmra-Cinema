<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دخول المشرف</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: Tahoma, sans-serif; text-align: center; padding-top: 80px; }
        .box { background: #1e1e1e; padding: 20px; border-radius: 10px; display: inline-block; width: 300px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #444; background: #2c2c2c; color: #fff; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 100%; }
        .error { color: #ff4d4d; }
    </style>
</head>
<body>
    <div class="box">
        <h2>تسجيل دخول المشرف</h2>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="POST">
            <input type="password" name="password" placeholder="أدخل كلمة المرور (123)" required>
            <button type="submit">دخول</button>
        </form>
    </div>
</body>
</html>
