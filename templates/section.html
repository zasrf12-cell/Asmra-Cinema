<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - سينما أسمرة</title>
    <style>
        body {
            background-color: #050000;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: 40px auto;
            background: #0a0a0a;
            padding: 20px;
            border-radius: 14px;
            border: 1px solid #333;
        }
        h2 { color: #ffcc00; }
        p { color: #aaa; font-size: 13px; line-height: 1.6; }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            background: #ff004f;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🚀 قسم: {{ title }}</h2>
        <p>أهلاً بك يا أبو سمرة في التردد الإمبراطوري الخاص بهذا القسم. جاري تجهيز أحدث الأفلام والملفات الخاصة به حصرياً لك!</p>
        <a href="{{ url_for('index') }}" class="back-btn">← العودة للرئيسية</a>
    </div>
</body>
</html>
