<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الإمبراطور | Asmra Cinema Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; padding: 20px; background: #1e293b; border-radius: 12px; border: 1px solid #334155; }
        h1 { color: #38bdf8; margin-bottom: 10px; font-size: 24px; }
        p { color: #94a3b8; font-size: 14px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .bot-card { background: #1e293b; padding: 20px; border-radius: 10px; border: 1px solid #334155; text-align: center; transition: 0.3s; }
        .bot-card:hover { border-color: #38bdf8; transform: translateY(-3px); }
        .bot-card h3 { color: #f1f5f9; margin-bottom: 10px; font-size: 18px; }
        .btn { background: #0284c7; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
        .btn:hover { background: #0369a1; }
        .back-link { display: block; text-align: center; margin-top: 30px; color: #38bdf8; text-decoration: none; font-weight: bold; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <h1>👑 لوحة قيادة الإمبراطور (التحكم في الـ 13 بوت)</h1>
        <p>منطقة محصنة ومخصصة لإدارة وتعديل وتشغيل أدوات Asmra Cinema</p>
    </header>

    <div class="grid-container">
        <!-- توليد كروت الـ 13 بوت بذكاء -->
        <script>
            for (let i = 1; i <= 13; i++) {
                document.write(`
                    <div class="bot-card">
                        <h3>🤖 البوت الذكي رقم ${i}</h3>
                        <p style="margin-bottom: 15px;">جاهز للتشغيل وإدارة المهام</p>
                        <button class="btn" onclick="runBot(${i})">تشغيل البوت</button>
                    </div>
                `);
            }

            function runBot(id) {
                fetch('/admin/run_bot/' + id, { method: 'POST' })
                    .then(response => response.text())
                    .then(data => {
                        alert(data);
                    })
                    .catch(error => {
                        alert('حدث خطأ أثناء الاتصال بالبوت يا إمبراطور!');
                    });
            }
        </script>
    </div>

    <a href="/" class="back-link">← العودة إلى الصفحة الرئيسية للموقع</a>

</body>
</html>
